name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -count=1 -race ./...
      - name: Build sidecar
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w" -o /tmp/mtools-plugin-ffmpeg . && rm -f /tmp/mtools-plugin-ffmpeg
